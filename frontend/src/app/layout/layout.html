<p-sidebar-layout uiSecondarySidebar #secondarySidebar="uiSecondarySidebar">
	<p-sidebar id="iconbar" side="left" collapsible="icon" [open]="sidebarOpen()">
		<p-sidebar-spacer />
		<p-sidebar-aside>
			<p-sidebar-panel>
				<p-sidebar-header>
					<p-sidebar-menu>
						<p-sidebar-menu-item>
							<button pSidebarMenuButton class="p-1!" (click)="userMenu.toggle($event)">
								<p-avatar label="JD" shape="circle" class="size-6! shrink-0 text-xs" />
								<span>John Doe</span>
							</button>
							<p-menu #userMenu [model]="userItems" [popup]="true" appendTo="body">
								<ng-template #item let-item>
									<a pRipple class="flex cursor-pointer items-center px-2.5 py-1.5">
										<svg [pIcon]="item.icon"></svg>
										<span class="ms-2 text-sm">{{ item.label }}</span>
									</a>
								</ng-template>
							</p-menu>
						</p-sidebar-menu-item>
					</p-sidebar-menu>
				</p-sidebar-header>
				<p-sidebar-content>
					<p-sidebar-group>
						<p-sidebar-group-content>
							<p-sidebar-menu>
								@for (item of menuItems; track item.link) {
								<p-sidebar-menu-item>
									<a
										[routerLink]="item.link"
										pSidebarMenuButton
										[pTooltip]="item.label"
										tooltipPosition="right"
										[tooltipDisabled]="sidebarOpen()"
										routerLinkActive
										[routerLinkActiveOptions]="item.routerLinkActiveOptions || {}"
										#rla="routerLinkActive"
										[isActive]="rla.isActive"
									>
										<svg [pIcon]="item.icon"></svg>
										<span>{{ item.label }}</span>
									</a>
								</p-sidebar-menu-item>
								}
							</p-sidebar-menu>
						</p-sidebar-group-content>
					</p-sidebar-group>
				</p-sidebar-content>
				<p-sidebar-footer>
					<p-sidebar-menu>
						<p-sidebar-menu-item>
							<button
								pSidebarMenuButton
								pTooltip="Theme"
								(click)="themeMenuRef.toggle($event)"
								[tooltipDisabled]="sidebarOpen()"
							>
								<svg [pIcon]="currentThemeIcon()"></svg>
								<span>Theme</span>
							</button>
							<p-menu #themeMenuRef [model]="themeMenu()" [popup]="true" appendTo="body">
								<ng-template #item let-item>
									<a pRipple class="flex cursor-pointer items-center px-2.5 py-1.5">
										<svg [pIcon]="item.icon"></svg>
										<span class="ms-2 text-sm">{{ item.label }}</span>
									</a>
								</ng-template>
							</p-menu>
						</p-sidebar-menu-item>

						<p-sidebar-menu-item>
							@let sidebarOpenLabel = sidebarOpen() ? 'Close' : 'Open';

							<button
								pSidebarMenuButton
								[pTooltip]="sidebarOpenLabel"
								[tooltipDisabled]="sidebarOpen()"
								tooltipPosition="right"
								(click)="toggleSidebar()"
							>
								<svg pIcon="sidebar"></svg>
								<span> {{ sidebarOpenLabel }}</span>
							</button>
						</p-sidebar-menu-item>
					</p-sidebar-menu>
				</p-sidebar-footer>
			</p-sidebar-panel>
		</p-sidebar-aside>
	</p-sidebar>
	<!-- Secondary sidebar - always open, not collapsible -->
	@if (secondarySidebar.portal()) {
	<p-sidebar id="secondary" side="left" collapsible="none" width="14rem">
		<p-sidebar-spacer />
		<p-sidebar-aside>
			<p-sidebar-panel>
				<ng-template [cdkPortalOutlet]="secondarySidebar.portal()" />
			</p-sidebar-panel>
		</p-sidebar-aside>
	</p-sidebar>
	}
	<!-- Main content -->
	<p-sidebar-main>
		<header class="border-surface-200 dark:border-surface-700 flex h-12 items-center gap-2 border-b px-4">
			<span class="text-sm font-medium">Table Editor</span>
			<span class="text-muted-color text-xs">/ users</span>
		</header>

		<main>
			<router-outlet />
		</main>
	</p-sidebar-main>
</p-sidebar-layout>
